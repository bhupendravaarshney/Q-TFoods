x-e2e-environment: &e2e-environment
  APP_NAME: Q & T FOODS ERP E2E
  APP_ENV: testing
  APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  APP_DEBUG: "true"
  APP_URL: http://localhost:18000
  LOG_CHANNEL: stderr
  LOG_LEVEL: debug
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: qtfoods_e2e
  DB_USERNAME: qtfoods_e2e
  DB_PASSWORD: qtfoods_e2e
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  FILESYSTEM_DISK: local
  MAIL_MAILER: log
  MAIL_FROM_ADDRESS: no-reply@qtfoods.local
  QT_FRONTEND_URL: http://127.0.0.1:4173
  QT_IDENTITY_PREVIEW_LINKS: "true"
  QT_EVIDENCE_DISK: evidence
  QT_EVIDENCE_RETENTION_YEARS: 7
  QT_EVIDENCE_RETENTION_POLICY: UNSOLD_RETURN_7Y
  QT_EVIDENCE_MAX_UPLOAD_KB: 10240
  AWS_ACCESS_KEY_ID: qtfoods-e2e
  AWS_SECRET_ACCESS_KEY: qtfoods-e2e-secret
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: qtfoods-evidence-e2e
  AWS_ENDPOINT: http://minio:9000
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  QT_OUTBOX_TRANSPORT: log
  QT_OUTBOX_BATCH_SIZE: 50
  QT_OUTBOX_MAX_ATTEMPTS: 4
  QT_OUTBOX_BASE_RETRY_SECONDS: 1
  QT_OUTBOX_MAX_RETRY_SECONDS: 10
  QT_OUTBOX_LOCK_TIMEOUT_SECONDS: 30

x-e2e-dependencies: &e2e-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully

services:
  migrate:
    build:
      context: .
    command:
      - sh
      - -lc
      - php artisan migrate:fresh --force && php artisan db:seed --force
    environment: *e2e-environment
    depends_on: *e2e-dependencies

  app:
    build:
      context: .
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment: *e2e-environment
    ports:
      - "18000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);\""]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 5s

  worker:
    build:
      context: .
    command: php artisan queue:work redis --queue=outbox,default --sleep=1 --tries=1 --timeout=120
    environment: *e2e-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    build:
      context: .
    command: php artisan schedule:work
    environment: *e2e-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: qtfoods_e2e
      POSTGRES_USER: qtfoods_e2e
      POSTGRES_PASSWORD: qtfoods_e2e
    volumes:
      - e2e_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtfoods_e2e -d qtfoods_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qtfoods-e2e
      MINIO_ROOT_PASSWORD: qtfoods-e2e-secret
    volumes:
      - e2e_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:latest
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 qtfoods-e2e qtfoods-e2e-secret &&
        mc mb --ignore-existing local/qtfoods-evidence-e2e &&
        mc anonymous set none local/qtfoods-evidence-e2e
    depends_on:
      minio:
        condition: service_healthy

volumes:
  e2e_pg:
  e2e_minio:
