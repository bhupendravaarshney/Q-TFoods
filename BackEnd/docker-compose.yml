x-app-environment: &app-environment
  APP_NAME: Q & T FOODS ERP
  APP_ENV: local
  APP_KEY: "${APP_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}"
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: qtfoods
  DB_USERNAME: qtfoods
  DB_PASSWORD: qtfoods
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  FILESYSTEM_DISK: local
  MAIL_MAILER: log
  MAIL_FROM_ADDRESS: no-reply@qtfoods.local
  QT_FRONTEND_URL: http://localhost:5173
  QT_IDENTITY_PREVIEW_LINKS: "true"
  QT_EVIDENCE_DISK: evidence
  QT_EVIDENCE_LEGACY_ROOT: /legacy-evidence
  QT_EVIDENCE_RETENTION_YEARS: 7
  QT_EVIDENCE_RETENTION_POLICY: UNSOLD_RETURN_7Y
  QT_EVIDENCE_MAX_UPLOAD_KB: 10240
  AWS_ACCESS_KEY_ID: qtfoods
  AWS_SECRET_ACCESS_KEY: qtfoods-secret-change-me
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: qtfoods-evidence
  AWS_ENDPOINT: http://minio:9000
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  QT_OUTBOX_TRANSPORT: log
  QT_OUTBOX_BATCH_SIZE: 50
  QT_OUTBOX_MAX_ATTEMPTS: 8
  QT_OUTBOX_BASE_RETRY_SECONDS: 30
  QT_OUTBOX_MAX_RETRY_SECONDS: 3600
  QT_OUTBOX_LOCK_TIMEOUT_SECONDS: 300

x-app-dependencies: &app-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully

services:
  migrate:
    build:
      context: .
    command:
      - sh
      - -lc
      - php artisan migrate --force && php artisan db:seed --force && php artisan qt:evidence:migrate-object-storage
    environment: *app-environment
    volumes:
      - qt_evidence:/legacy-evidence:ro
    depends_on: *app-dependencies

  app:
    build:
      context: .
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
    command: php artisan queue:work redis --queue=outbox,default --sleep=2 --tries=1 --timeout=120
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  scheduler:
    build:
      context: .
    command: php artisan schedule:work
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: qtfoods
      POSTGRES_USER: qtfoods
      POSTGRES_PASSWORD: qtfoods
    ports:
      - "5432:5432"
    volumes:
      - qt_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtfoods -d qtfoods"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qtfoods
      MINIO_ROOT_PASSWORD: qtfoods-secret-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - qt_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:latest
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 qtfoods qtfoods-secret-change-me &&
        mc mb --ignore-existing local/qtfoods-evidence &&
        mc anonymous set none local/qtfoods-evidence
    depends_on:
      minio:
        condition: service_healthy

volumes:
  qt_pg:
  qt_minio:
  qt_evidence:
