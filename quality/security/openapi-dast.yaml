openapi: 3.0.3
info:
  title: Q & T Foods ERP authenticated DAST surface
  version: 1.0.0
  description: >-
    A bounded, non-destructive subset of the canonical API contract used for
    pull-request active scanning. It covers public identity input, authenticated
    JSON input, and representative scoped query surfaces without invoking
    business posting or lifecycle commands.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: dastLoginInput
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: invalid-dast-user@qtfoods.local
                password:
                  type: string
                  format: password
                  example: invalid-dast-password
      responses:
        '200': { description: Authenticated }
        '422': { description: Invalid credentials or input }
        '429': { description: Rate limited }
  /contexts/select:
    post:
      operationId: dastContextInput
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, plant_id]
              properties:
                company_id:
                  type: string
                  format: uuid
                  example: 00000000-0000-4000-8000-000000000001
                plant_id:
                  type: string
                  format: uuid
                  example: 00000000-0000-4000-8000-000000000101
      responses:
        '200': { description: Context selected }
        '401': { description: Unauthenticated }
        '422': { description: Invalid or unauthorised context }
  /me:
    get:
      operationId: dastSessionRead
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Current ERP session }
        '401': { description: Unauthenticated }
  /work/tasks:
    get:
      operationId: dastWorkQueueRead
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 }, example: dast-probe }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 }, example: 10 }
        - { in: query, name: sort, schema: { type: string, enum: [priority, due_at, created_at] }, example: priority }
      responses:
        '200': { description: Scoped work queue }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
  /admin/organisation:
    get:
      operationId: dastOrganisationRead
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Scoped organisation workspace }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
  /admin/locations:
    get:
      operationId: dastLocationRead
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 }, example: dast-probe }
        - { in: query, name: status, schema: { type: string, enum: [ACTIVE, INACTIVE] }, example: ACTIVE }
      responses:
        '200': { description: Scoped location workspace }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
  /reports:
    get:
      operationId: dastReportRead
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 }, example: dast-probe }
        - in: query
          name: report_code
          schema:
            type: string
            enum: [TRIAL_BALANCE, RECEIVABLE_AGING, INVENTORY_AVAILABILITY, ORDER_FULFILMENT]
          example: TRIAL_BALANCE
      responses:
        '200': { description: Scoped report workspace }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
  /admin/help:
    get:
      operationId: dastHelpRead
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 }, example: dast-probe }
        - in: query
          name: article_category
          schema: { type: string, enum: [GETTING_STARTED, WORKFLOWS, CONTROLS, SECURITY, REPORTING] }
          example: SECURITY
      responses:
        '200': { description: Scoped help workspace }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: qt_foods_erp_session
  parameters:
    CsrfToken:
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema:
        type: string
        example: injected-by-dast-runner
